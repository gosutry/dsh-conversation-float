name: Check

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript syntax
        run: |
          find . -path ./node_modules -prune -o -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Validate package manifest
        run: |
          node -e "const p=require('./package.json'); if(!p.name || !p.version) throw new Error('missing name/version'); if(p.private) throw new Error(p.name + ' is private'); console.log('package:', p.name, p.version)"

      - name: Check declared files exist
        run: |
          node -e "
          const fs=require('fs'), p=require('./package.json');
          const missing=[];
          for (const pat of p.files) {
            if (pat.includes('*')) continue;
            if (!fs.existsSync(pat)) missing.push(pat);
          }
          if (missing.length) throw new Error('missing files: ' + missing.join(', '));
          for (const k of ['index.js','client.js','cordis.patch.yml']) if (!fs.existsSync(k)) throw new Error('missing ' + k);
          if (!fs.existsSync('LICENSE')) throw new Error('missing LICENSE');
          console.log('declared files ok');
          "

      - name: Check npm package contents
        run: npm pack --dry-run
